# Vérifications à chaque envoi sur v3 et main : types, lint (erreurs seulement), tests.
name: CI
on:
  push:
    branches: [v3, main]
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --quiet
      - run: npm test
